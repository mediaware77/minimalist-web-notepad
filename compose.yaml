services:
  notepad:
    build: .
    restart: unless-stopped
    environment:
      NOTEPAD_DATA_DIR: /var/lib/notepad
    volumes:
      - notes:/var/lib/notepad
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 100
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

volumes:
  notes:
    name: minimalist-web-notepad-notes
